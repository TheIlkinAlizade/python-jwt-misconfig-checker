[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-jwt-misconfig-checker"
version = "0.1.0"
description = "Offline CLI that analyzes JWTs for security misconfigurations, with severity ratings, explanations, and fix advice. Defensive and educational."
readme = "README.md"
license = "none yet"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "cryptography>=42.0",
]
classifiers = [
    "Environment :: Console",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
jwt-misconfig-check = "jwt_misconfig_checker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jwt_misconfig_checker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]